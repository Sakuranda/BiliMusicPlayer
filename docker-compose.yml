name: bilimusicplayer
services:
  api:
    image: ${APP_IMAGE:-bilimusicplayer-api:local}
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: ./deploy/.env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
    logging:
      options: {max-size: 10m, max-file: '3'}
  navidrome:
    image: deluan/navidrome:0.63.2
    restart: unless-stopped
    user: '0:0'
    environment:
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 720h
      ND_SCANNER_SCHEDULE: '@every 1m'
      ND_AUTOIMPORTPLAYLISTS: 'true'
      ND_RECENTLYADDEDBYMODTIME: 'false'
    volumes:
      - ./data/music:/music:ro
      - ./deploy/navidrome-playlists:/music/MusicPlayer-Playlists:ro
      - ./data/navidrome:/data
    ports:
      - "127.0.0.1:${NAVIDROME_PORT:-4533}:4533"
    logging:
      options: {max-size: 10m, max-file: '3'}
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: [https]
    environment:
      MUSIC_DOMAIN: ${MUSIC_DOMAIN:-localhost}
      NAVIDROME_DOMAIN: ${NAVIDROME_DOMAIN:-navi.localhost}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    depends_on:
      api: {condition: service_healthy}
      navidrome: {condition: service_started}
    logging:
      options: {max-size: 10m, max-file: '3'}
