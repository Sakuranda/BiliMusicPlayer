name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version and create assets
        run: |
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
          python3 scripts/package_release.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-dist/bilimusicplayer.tar.gz release-dist/install.sh release-dist/SHA256SUMS --title "BiliMusicPlayer $GITHUB_REF_NAME" --notes-file docs/releases/$GITHUB_REF_NAME.md --verify-tag
